[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "numcompute"
version = "0.2.0"
description = "A NumPy decision-tree framework for buffered streaming machine learning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["numcompute*", "numcompute_stream*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
